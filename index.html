  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REDDY888 - Get Your New ID</title>
  <style>
    /* Reset and Base Styling */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #070707;
      --card-bg: rgba(20, 19, 16, 0.88);
      --card-border: rgba(255, 177, 35, 0.24);
      --neon-lime: #c8ff00;
      --gold: #ffd52a;
      --orange: #ff8617;
      --cyan: #13d9f5;
      --neon-glow: rgba(200, 255, 0, 0.30);
      --neon-glow-strong: rgba(255, 166, 24, 0.48);
      --text-white: #ffffff;
      --text-muted: #aaa49a;
      --timer-red: #ffb12b;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(255,164,25,.16), transparent 36%),
        radial-gradient(ellipse at 8% 80%, rgba(19,217,245,.09), transparent 32%),
        radial-gradient(ellipse at 92% 70%, rgba(200,255,0,.10), transparent 30%),
        var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle radial ambient glow at the top */
    body::before {
      content: "";
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      height: 360px;
      background: radial-gradient(circle, rgba(255, 167, 31, 0.20) 0%, rgba(5, 5, 5, 0) 68%);
      filter: blur(12px);
      animation: ambientPulse 6s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    /* Main Responsive Container */
    .container {
      width: 100%;
      max-width: 440px;
      padding: 36px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: pageEnter .85s cubic-bezier(.2,.8,.2,1) both;
    }

    /* Circular Logo Badge */
    .logo-badge {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background-color: #0b0b0b;
      border: 2.5px solid var(--neon-lime);
      box-shadow: 0 0 28px var(--neon-glow), 0 0 42px rgba(255,134,23,.16), inset 0 0 14px rgba(200, 255, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
      transition: transform 0.3s ease;
      overflow: hidden;
      animation: logoFloat 4s ease-in-out infinite, logoGlow 3s ease-in-out infinite alternate;
    }

    .logo-badge:hover {
      transform: scale(1.06) rotate(2deg);
    }

    .logo-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Brand Heading */
    .brand-title {
      font-size: clamp(2rem, 8.5vw, 2.55rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .brand-title .white-part {
      color: var(--text-white);
      text-transform: uppercase;
    }

    .brand-title .lime-part {
      background: linear-gradient(180deg, #fff36b 0%, var(--gold) 38%, var(--orange) 76%, #ff6b16 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: .45px rgba(19,217,245,.45);
      text-transform: uppercase;
      filter: drop-shadow(0 3px 0 rgba(0,115,145,.5)) drop-shadow(0 0 18px rgba(255,145,20,.22));
    }

    .brand-title {
      text-shadow: 0 0 24px rgba(200,255,0,.12);
      animation: titleReveal .9s .12s both;
    }

    /* Subheading */
    .subheading {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      color: #a3a3a3;
      text-transform: uppercase;
      margin-bottom: 32px;
      animation: titleReveal .9s .22s both;
    }

    /* Primary CTA Button */
    .cta-button {
      width: 100%;
      background: linear-gradient(105deg, #c8ff00 0%, #f6ed20 42%, #ffad24 100%);
      color: #101006;
      text-decoration: none;
      border-radius: 16px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: clamp(0.82rem, 3.8vw, 1.02rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 0 32px var(--neon-glow-strong), 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      animation: buttonPulse 2.8s ease-in-out infinite;
    }

    .cta-button::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -45%;
      width: 32%;
      height: 220%;
      background: rgba(255,255,255,.48);
      transform: rotate(25deg);
      filter: blur(8px);
      animation: buttonShine 4.5s ease-in-out infinite;
      z-index: -1;
      pointer-events: none;
    }

    .cta-button:hover {
      background: linear-gradient(105deg, #dcff39 0%, #fff04a 42%, #ffbd46 100%);
      box-shadow: 0 0 42px rgba(255, 166, 24, 0.48), 0 10px 24px rgba(0, 0, 0, 0.7);
      transform: translateY(-2px);
    }

    .cta-button:active {
      transform: scale(0.98);
    }

    /* Telegram Icon inside button */
    .tg-icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Helper Text below Button */
    .helper-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 16px;
      margin-bottom: 24px;
      font-weight: 400;
    }

    /* Countdown Pill */
    .countdown-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #0d0d0d;
      border: 1px solid #222222;
      border-radius: 999px;
      padding: 10px 26px;
      margin-bottom: 32px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), inset 0 1px rgba(255,255,255,.04);
      animation: titleReveal .8s .3s both;
    }

    .countdown-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #d4d4d4;
      text-transform: uppercase;
    }

    .countdown-time {
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--timer-red);
      font-variant-numeric: tabular-nums;
    }

    /* 3 Feature Cards Grid */
    .features-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 34px;
    }

    .feature-card {
      background: linear-gradient(145deg, rgba(28,34,29,.92), var(--card-bg));
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 26px rgba(0,0,0,.35), inset 0 1px rgba(255,213,42,.06);
      border-radius: 18px;
      padding: 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: border-color 0.25s ease, transform 0.25s ease, box-shadow .25s ease;
      animation: cardRise .7s both;
    }

    .feature-card:nth-child(1) { animation-delay: .18s; }
    .feature-card:nth-child(2) { animation-delay: .32s; }
    .feature-card:nth-child(3) { animation-delay: .46s; }

    .feature-card:hover {
      border-color: rgba(255, 177, 35, 0.62);
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(255,145,20,.12), 0 0 18px rgba(19,217,245,.06);
    }

    .feature-icon {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feature-stat {
      font-size: clamp(1.1rem, 4.2vw, 1.3rem);
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 6px;
      line-height: 1.1;
    }

    .feature-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Bottom Trust Badges Row */
    .trust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.8rem;
      color: #9ca3af;
      font-weight: 500;
      animation: titleReveal .8s .55s both;
    }

    .trust-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .trust-dot {
      color: #4b5563;
      font-size: 0.9rem;
      user-select: none;
    }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes titleReveal {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes logoGlow {
      from { box-shadow: 0 0 22px rgba(200,255,0,.28), 0 0 12px rgba(255,134,23,.12), inset 0 0 14px rgba(200,255,0,.10); }
      to { box-shadow: 0 0 42px rgba(200,255,0,.48), 0 0 24px rgba(255,134,23,.24), inset 0 0 20px rgba(200,255,0,.18); }
    }
    @keyframes ambientPulse {
      from { opacity: .55; transform: translateX(-50%) scale(.92); }
      to { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }
    @keyframes buttonPulse {
      0%, 100% { box-shadow: 0 0 24px rgba(200,255,0,.25), 0 8px 20px rgba(0,0,0,.6); }
      50% { box-shadow: 0 0 42px var(--neon-glow-strong), 0 8px 24px rgba(0,0,0,.65); }
    }
    @keyframes buttonShine {
      0%, 68% { left: -45%; opacity: 0; }
      75% { opacity: .8; }
      88%, 100% { left: 125%; opacity: 0; }
    }
    @keyframes cardRise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    /* Small screen adjustments */
    @media (max-width: 360px) {
      .container {
        padding: 28px 14px 24px;
      }
      .features-grid {
        gap: 8px;
      }
      .feature-card {
        padding: 16px 4px;
      }
      .trust-row {
        gap: 8px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>

  <script>
    // Live Countdown Timer starting at 14:35 (875 seconds)
    (function () {
      const timerDisplay = document.getElementById("countdown");
      const initialSeconds = 14 * 60 + 35;
      let remainingSeconds = initialSeconds;

      function formatTime(totalSecs) {
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      }

      // Initialize display immediately
      if (timerDisplay) {
        timerDisplay.textContent = formatTime(remainingSeconds);

        setInterval(function () {
          if (remainingSeconds > 0) {
            remainingSeconds -= 1;
          } else {
            // Reset smoothly so urgency stays active
            remainingSeconds = initialSeconds;
          }
          timerDisplay.textContent = formatTime(remainingSeconds);
        }, 1000);
      }
    })();
  </script>
